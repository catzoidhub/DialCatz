<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!--
      Runs request scripts (pre-request, tests). Loaded in an <iframe sandbox="allow-scripts">: an opaque origin with
      no access to the app, its storage or window.dialcatz, and no network (connect-src 'none'). A script only gets
      the request / response it is given and returns test results, variable changes and log lines.
      Each script runs in its own Worker, terminated after TIMEOUT: an endless loop cannot hang this page.
      Scripts run as async functions (top-level await works) and async tests are awaited before the results go back.
      A runner iteration's data row is in dc.data / pm.iterationData.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; worker-src blob:" />
  </head>
  <body>
    <!-- The worker's code (runs one script; plain text here, started from a blob). -->
    <script id="worker" type="text/plain">
      'use strict';
      const deepEqual = (a, b) => {
        if (Object.is(a, b)) return true;
        if (typeof a !== 'object' || typeof b !== 'object' || !a || !b) return false;
        if (Array.isArray(a) !== Array.isArray(b)) return false;
        const ka = Object.keys(a);
        const kb = Object.keys(b);
        return ka.length === kb.length && ka.every((k) => deepEqual(a[k], b[k]));
      };
      const show = (v) => {
        try {
          return typeof v === 'string' ? JSON.stringify(v) : JSON.stringify(v) ?? String(v);
        } catch {
          return String(v);
        }
      };
      const getPath = (obj, path) => String(path).split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
      const hasPath = (obj, path) => {
        const keys = String(path).split('.');
        let o = obj;
        for (const k of keys) {
          if (o == null || !Object.prototype.hasOwnProperty.call(Object(o), k)) return false;
          o = o[k];
        }
        return true;
      };

      /** expect(value).toBe(…) — Jest-like, with .not, and a Postman/chai-like `.to` for pm scripts. */
      function expect(actual) {
        const make = (negate) => {
          const check = (ok, msg) => {
            if (negate ? ok : !ok) throw new Error((negate ? 'Expected not: ' : 'Expected: ') + msg);
          };
          const m = {
            toBe: (x) => check(Object.is(actual, x), `${show(actual)} to be ${show(x)}`),
            toEqual: (x) => check(deepEqual(actual, x), `${show(actual)} to equal ${show(x)}`),
            toBeTruthy: () => check(!!actual, `${show(actual)} to be truthy`),
            toBeFalsy: () => check(!actual, `${show(actual)} to be falsy`),
            toBeDefined: () => check(actual !== undefined, `${show(actual)} to be defined`),
            toBeNull: () => check(actual === null, `${show(actual)} to be null`),
            toContain: (x) => check(actual != null && actual.includes && actual.includes(x), `${show(actual)} to contain ${show(x)}`),
            toMatch: (re) => check(new RegExp(re).test(String(actual)), `${show(actual)} to match ${re}`),
            toBeGreaterThan: (x) => check(actual > x, `${show(actual)} > ${show(x)}`),
            toBeLessThan: (x) => check(actual < x, `${show(actual)} < ${show(x)}`),
            toHaveProperty: (p, ...value) => check(hasPath(actual, p) && (!value.length || deepEqual(getPath(actual, p), value[0])), `${show(actual)} to have property ${p}${value.length ? ` = ${show(value[0])}` : ''}`),
            toHaveLength: (n) => check(actual != null && actual.length === n, `${show(actual)} to have length ${n}`),

        };
        const api = make(false);
        api.not = make(true);
        Object.defineProperty(api.not, 'to', { get: () => chain(actual, { not: true }) });
        for (const w of ['be', 'have']) Object.defineProperty(api.not, w, { get: () => chain(actual, { not: true }) });

        Object.defineProperty(api, 'to', { get: () => chain(actual, {}) });
        for (const w of ['be', 'have', 'is', 'that', 'and', 'deep', 'has']) if (!(w in api)) Object.defineProperty(api, w, { get: () => chain(actual, {})[w] });

      const typeOf = (v) => (v === null ? 'null' : Array.isArray(v) ? 'array' : v instanceof Date ? 'date' : v instanceof RegExp ? 'regexp' : typeof v);

        let o = obj;
        for (const k of keysOf(path)) {
          if (o == null || !Object.prototype.hasOwnProperty.call(Object(o), k)) return { found: false };
          o = o[k];
        }
        return { found: true, value: o };
      };

      /** The chai words scripts use. `f` holds the flags before a word: not, deep, any, nested, contains. */

        const oneOf = (list) => check(f.contains ? list.some((x) => includes(x)) : list.some((x) => same(actual, x)), `to be one of ${show(list)}`);

          let err = null;
          try {
            actual();
          } catch (e) {
            err = e;
          }

        };
        const words = {
          equal, equals: equal, eq: equal, eql, eqls: eql,
          match: (re) => check(new RegExp(re).test(String(actual)), `to match ${re}`),
          above: gt, gt, greaterThan: gt, least: gte, gte, greaterThanOrEqual: gte, below: lt, lt, lessThan: lt, most: lte, lte, lessThanOrEqual: lte,
          within: (a, b) => check((f.length ? size(actual) : actual) >= a && (f.length ? size(actual) : actual) <= b, `to be within ${a}..${b}`),
          closeTo: (x, d) => check(Math.abs(actual - x) <= d, `to be close to ${x}`),
          property, ownProperty: property, keys, key: keys, members, oneOf, throw: throws, throws,
          string: (x) => check(typeof actual === 'string' && actual.includes(x), `to contain ${show(x)}`),
          startWith: (x) => check(typeof actual === 'string' && actual.startsWith(x), `to start with ${show(x)}`),
          endWith: (x) => check(typeof actual === 'string' && actual.endsWith(x), `to end with ${show(x)}`),
          instanceof: (c) => check(actual instanceof c, `to be an instance of ${c && c.name}`),
          satisfy: (fn) => check(!!fn(actual), 'to satisfy the function'),
          jsonBody: (...args) => {
            if (!args.length) return check(typeof actual === 'object' && actual !== null, 'to be a JSON body');
            if (args.length === 1 && typeof args[0] === 'object' && args[0] !== null) return eql(args[0]);
            const r = dig(actual, args[0]);
            return check(r.found && (args.length < 2 || deepEqual(r.value, args[1])), `to have ${args[0]}${args.length > 1 ? ` = ${show(args[1])}` : ''}`);

          get ok() { return check(!!actual, 'to be truthy'); },
          get true() { return check(actual === true, 'to be true'); },
          get false() { return check(actual === false, 'to be false'); },
          get null() { return check(actual === null, 'to be null'); },
          get undefined() { return check(actual === undefined, 'to be undefined'); },
          get NaN() { return check(Number.isNaN(actual), 'to be NaN'); },
          get exist() { return check(actual != null, 'to exist'); },
          get empty() { return check(actual != null && size(actual) === 0, 'to be empty'); },
          get json() { return check(typeOf(actual) === 'object' || typeOf(actual) === 'array', 'to be JSON'); },

          get deep() { return chain(actual, { ...f, deep: true }); },

          get all() { return chain(actual, { ...f, any: false }); },

      }

      /** The first thing a value breaks of a JSON Schema (draft-07's common words), or ''. */

            }
          }

        }

      /** Bruno's res('a.b[0].c', fn): keys (an array gives each element's), ..key anywhere below, [n], [?] with a function or an object. */
      function query(data, expr, ...fns) {
        const steps = [...String(expr).matchAll(/(\.\.)?([^.[\]]+)|\[(\?|-?\d+|"[^"]*"|'[^']*')\]/g)];
        const deepFind = (v, k, out) => {
          if (Array.isArray(v)) v.forEach((x) => deepFind(x, k, out));
          else if (v && typeof v === 'object')

              deepFind(x, k, out);

        }

      }

          } catch {

          }

      const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;

    <script>
      'use strict';
      const TIMEOUT = 10000;
      const workerUrl = URL.createObjectURL(new Blob([document.getElementById('worker').textContent], { type: 'text/javascript' }));
      window.addEventListener('message', (ev) => {
        const { id } = ev.data || {};
        if (!id) return;
        const w = new Worker(workerUrl);
        const finish = (msg) => {
          clearTimeout(timer);
          w.terminate();
          parent.postMessage(msg, '*');
        };
        const timer = setTimeout(() => finish({ id, tests: [], logs: [], changes: {}, error: `The script ran longer than ${TIMEOUT / 1000} s and was stopped` }), TIMEOUT);

        w.onerror = (e) => finish({ id, tests: [], logs: [], changes: {}, error: e.message || 'The script failed' });

      });
      parent.postMessage({ ready: true }, '*');
