info:
  name: Query
  type: graphql
  seq: 2
graphql:
  method: POST
  url: "{{baseUrl}}/echo"
  body:
    query: |-
      query { me { id } }
    variables: |-
      {"n": 1}
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://id.test/token
    credentials:
      clientId: c
      clientSecret: "{{secret}}"
      placement: basic_auth_header
    scope: read
