appId: com.mrcatz.dialcatz
productName: DialCatz
copyright: Copyright © 2026 Mahryan Rakhmatullah
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
# the licences of the open-source packages inside (Catzoid #66), opened from About → Third-party licences
extraResources:
  - from: resources/third-party-licenses.txt
    to: third-party-licenses.txt
protocols:
  - name: DialCatz
    schemes: [dialcatz]
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  # Apple silicon here; the Intel build is `bun run package --x64` (both on every release, one merged latest-mac.yml).
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Notarized with the keychain profile mrcatz-notary (scripts/package.mjs): the app here, the DMG after.
  notarize: true
  minimumSystemVersion: '13.0'
dmg:
  # Signed too, then notarized and stapled by scripts/package.mjs (Apple's recommended order).
  sign: true
  title: DialCatz ${version}
  artifactName: DialCatz-${version}-${arch}.${ext}
  contents:
    - { x: 150, y: 190, type: file }
    - { x: 450, y: 190, type: link, path: /Applications }
  window: { width: 600, height: 400 }
  # The DialCatz look, drawn from scripts/dmg/background.svg (1× and @2x), as DevCatz and DBCatz.
  background: resources/dmg/background.png
  iconSize: 112
  iconTextSize: 13
win:
  icon: resources/icon.png # ≥ 256 × 256; electron-builder makes the .ico
  target:
    - target: nsis
      arch: [x64]
  # Sets the .exe's icon and version info; with no certificate configured nothing is signed here.
  signAndEditExecutable: true
nsis:
  oneClick: false
  # Per user: no administrator prompt, and in-app updates work without UAC.
  perMachine: false
  allowToChangeInstallationDirectory: true
  # What the Catzoid site's catalog matches (catalog.go winX64), like the other Catzoid apps (Catzoid #78).
  artifactName: ${productName}-Setup-${version}.${ext}
  # The DialCatz look (drawn from scripts/installer/*.svg) and the Welcome / Shortcuts pages (resources/installer/installer.nsh).
  installerSidebar: resources/installer/sidebar.bmp
  uninstallerSidebar: resources/installer/sidebar.bmp
  installerHeader: resources/installer/header.bmp
  include: resources/installer/installer.nsh
  shortcutName: DialCatz
  # Asked on the Shortcuts page instead (installer.nsh); the Start menu entry is always made.
  createDesktopShortcut: false
  createStartMenuShortcut: true
  uninstallDisplayName: ${productName}
npmRebuild: false
# In-app updates (Catzoid #54): writes app-update.yml into the app. The feed address is set at run time from the
# shared Catzoid site address (src/main/updates.ts), so this URL is only the default; builds never upload anything.
publish:
  provider: generic
  url: https://catzoid.com/updates/dialcatz/
