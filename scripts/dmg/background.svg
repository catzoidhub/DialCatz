<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- DMG window background (600 × 400; icons at 150,190 and 450,190 — electron-builder.yml dmg.contents).
       Colours: the DialCatz tile's teal, with the logo's indigo for the wordmark (dark text on a light tile) and its
       amber as the accent. Mid-tone on purpose: Finder writes icon labels black in light mode and white in dark mode;
       both read here. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fcfba"/>
      <stop offset="0.55" stop-color="#2fb9a3"/>
      <stop offset="1" stop-color="#21a18d"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="0.12" cy="1" r="0.6">
      <stop offset="0" stop-color="#ffc14d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffc14d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLight" cx="0.95" cy="0.02" r="0.5">
      <stop offset="0" stop-color="#b6fff2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b6fff2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotsFade"><rect width="600" height="400" fill="url(#fade)"/></mask>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#glowAmber)"/>
  <rect width="600" height="400" fill="url(#glowLight)"/>
  <rect width="600" height="400" fill="url(#dots)" mask="url(#dotsFade)"/>

  <!-- Wordmark and the one instruction -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" text-anchor="middle" fill="#241f6e">
    <text x="300" y="58" font-size="24" font-weight="700" letter-spacing="-0.4">DialCatz</text>
    <text x="300" y="82" font-size="13" font-weight="500" fill-opacity="0.8">Drag DialCatz into Applications to install</text>
  </g>

  <!-- Soft stages under the two icons -->
  <circle cx="150" cy="190" r="92" fill="url(#halo)"/>
  <circle cx="450" cy="190" r="92" fill="url(#halo)"/>

  <!-- The arrow: the logo's waves ringing out towards Applications, the call going out -->
  <g fill="none" stroke="#241f6e" stroke-width="5" stroke-linecap="round">
    <path d="M268 174 A20 20 0 0 1 268 206" stroke-opacity="0.3"/>
    <path d="M286 164 A32 32 0 0 1 286 216" stroke-opacity="0.55"/>
    <path d="M304 154 A44 44 0 0 1 304 226" stroke-opacity="0.9"/>
  </g>
  <circle cx="252" cy="190" r="5" fill="#ffc14d" stroke="#241f6e" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Footer -->
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" text-anchor="middle" fill="#241f6e" fill-opacity="0.62" font-size="11" font-weight="500">
    <text x="300" y="372">REST, GraphQL and WebSocket requests, shared with your team</text>
  </g>
</svg>
