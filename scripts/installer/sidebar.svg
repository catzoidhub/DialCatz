<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="164" height="314" viewBox="0 0 164 314">
  <!-- NSIS Welcome / Finish sidebar (164 × 314, the size MUI2 draws it at), in the colours of the DialCatz tile: teal,
       with the logo's indigo for text (dark text on a light tile) and its amber as the accent. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#8eeedf"/>
      <stop offset="0.6" stop-color="#5fdcc7"/>
      <stop offset="1" stop-color="#3ccab2"/>
    </linearGradient>
    <radialGradient id="amber" cx="0" cy="1" r="0.75">
      <stop offset="0" stop-color="#ffc14d" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffc14d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#fff" fill-opacity="0.25"/></pattern>
  </defs>
  <rect width="164" height="314" fill="url(#bg)"/>
  <rect width="164" height="314" fill="url(#amber)"/>
  <rect width="164" height="150" fill="url(#dots)"/>
  <circle cx="82" cy="104" r="62" fill="url(#halo)"/>
  <image href="../../resources/icon.png" x="40" y="62" width="84" height="84"/>
  <g font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" text-anchor="middle" fill="#2a2480">
    <text x="82" y="176" font-size="19" font-weight="700" letter-spacing="-0.3">DialCatz</text>
    <text x="82" y="194" font-size="9.5" font-weight="500" fill-opacity="0.75">Dial an endpoint. Hear it purr.</text>
  </g>
  <!-- The call going out: the ear's waves, as on the logo. -->
  <g fill="none" stroke="#2a2480" stroke-width="2.6" stroke-linecap="round">
    <path d="M70 258 A12 12 0 0 1 70 278" stroke-opacity="0.3"/>
    <path d="M78 253 A19 19 0 0 1 78 283" stroke-opacity="0.55"/>
    <path d="M86 248 A26 26 0 0 1 86 288" stroke-opacity="0.9"/>
  </g>
  <circle cx="62" cy="268" r="3" fill="#ffc14d" stroke="#2a2480" stroke-opacity="0.35"/>
</svg>
